<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <style>
    /* Full page styling with dark background */
    body {
      background-color: #111111; 
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Your custom PLAY MUSIC button styling */
    .play-btn {
      background-color: transparent;
      color: white;
      border: 2px solid white;
      border-radius: 8px;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .play-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <!-- Your specific Google Drive audio file link -->
  <audio id="myAudio">
    <source src="https://google.com" type="audio/mp3">
  </audio>

  <!-- The Button Structure -->
  <button class="play-btn" onclick="togglePlay()">
    <span id="playIcon">►</span> <span id="btnText">PLAY MUSIC</span>
  </button>

  <script>
    var audio = document.getElementById("myAudio");
    var playIcon = document.getElementById("playIcon");
    var btnText = document.getElementById("btnText");

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playIcon.innerText = "❚❚"; 
        btnText.innerText = "PAUSE MUSIC";
      } else {
        audio.pause();
        playIcon.innerText = "►"; 
        btnText.innerText = "PLAY MUSIC";
      }
    }
  </script>

</body>
</html>
